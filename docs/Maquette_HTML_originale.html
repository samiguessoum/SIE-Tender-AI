const metresStore={};

function metresCase(){return dceCase()}
function metresFmt(n){return Number(n||0).toLocaleString('fr-FR')}
function metresFile(input){
 const file=input.files&&input.files[0];if(!file)return;
 const ext=file.name.split('.').pop().toLowerCase();
 if(!['xlsx','xls','csv'].includes(ext)){alert('Sélectionnez un fichier Excel (.xlsx, .xls) ou CSV.');return}
 const reader=new FileReader();
 reader.onerror=()=>alert('Lecture du fichier impossible.');
 reader.onload=()=>{
  try{
   if(typeof XLSX==='undefined')throw Error('Le module de lecture Excel n’est pas disponible. Connectez-vous à Internet pour charger la bibliothèque, ou utilisez un CSV.');
   const wb=XLSX.read(reader.result,{type:'array',cellDates:false});
   const sheets=wb.SheetNames.map(name=>({name,rows:XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,defval:'',raw:false,blankrows:false}).slice(0,5000)}));
   metresPending={caseId:metresCase().id,fileName:file.name,size:file.size,sheets,active:0,headers:0,columns:{designation:0,unite:1,quantite:2,reference:3},lot:'',status:'Prévisualisation locale'};
   render();
  }catch(e){alert('Import impossible : '+e.message)}
 };
 if(ext==='csv'&&typeof XLSX==='undefined'){
  reader.onload=()=>{const lines=String(reader.result).replace(/^\uFEFF/,'').split(/\r?\n/).filter(Boolean);const delim=(lines[0].match(/;/g)||[]).length>=(lines[0].match(/,/g)||[]).length?';':',';metresPending={caseId:metresCase().id,fileName:file.name,size:file.size,sheets:[{name:'CSV',rows:lines.slice(0,5000).map(l=>l.split(delim))}],active:0,headers:0,columns:{designation:0,unite:1,quantite:2,reference:3},lot:'',status:'Prévisualisation CSV'};render()};reader.readAsText(file);return;
 }
 reader.readAsArrayBuffer(file);
}
function metresSetSheet(i){if(!metresPending)return;metresPending.active=Number(i);render()}
function metresSetCol(k,v){if(metresPending)metresPending.columns[k]=Number(v)}
function metresSetLot(v){if(metresPending)metresPending.lot=v}
function metresRows(){if(!metresPending)return[];let p=metresPending,rows=p.sheets[p.active].rows;return rows.slice(Number(p.headers)+1).filter(r=>r.some(v=>String(v??'').trim())).map((r,i)=>({ligne:i+2,designation:String(r[p.columns.designation]??''),unite:String(r[p.columns.unite]??''),quantite:String(r[p.columns.quantite]??''),reference:String(r[p.columns.reference]??'')}))}
function metresSave(){if(!metresPending)return;const p=metresPending,rows=metresRows();if(!rows.length){alert('Aucune ligne de métrés détectée. Vérifiez la feuille et les colonnes.');return}const key=p.caseId;metresStore[key]??=[];metresStore[key].push({fileName:p.fileName,lot:p.lot||'À affecter',sheet:p.sheets[p.active].name,rows,importedAt:new Date().toLocaleString('fr-FR'),size:p.size});metresPending=null;render()}

 <div class="card sectiongap"><div class="card-head"><div><h3>Consultation concernée</h3><small>Le fichier Excel est associé à la consultation sélectionnée.</small></div><span class="badge blue">${esc(c.id)}</span></div><div class="card-body"><select class="field" style="width:100%" onchange="state.selected=Number(this.value);metresPending=null;render()">${[...cases,...state.newCases].map((x,i)=>`<option value="${i}" ${i===state.selected?'selected':''}>${esc(x.id)} — ${esc(x.name)}</option>`).join('')}</select></div></div>

 ${p?`<div class="card sectiongap"><div class="card-head"><div><h3>2. Vérifier les données importées</h3><small>${esc(p.fileName)} · ${metresFmt(p.size)} octets</small></div><span class="badge blue">À vérifier</span></div><div class="card-body"><div class="grid two"><div><label class="small">Feuille Excel</label><select class="field" style="width:100%" onchange="metresSetSheet(this.value)">${p.sheets.map((sh,i)=>`<option value="${i}" ${p.active===i?'selected':''}>${esc(sh.name)}</option>`).join('')}</select></div><div><label class="small">Lot concerné (saisie SIE)</label><input class="field" style="width:100%" placeholder="Ex. Lot 05 — CFO/CFA" value="${esc(p.lot)}" oninput="metresSetLot(this.value)"/></div></div><p class="small" style="margin-top:15px">Associer les colonnes du fichier aux champs SIE (première ligne considérée comme en-tête).</p><div class="grid two" style="margin-top:12px">${selects}</div><div style="overflow-x:auto;margin-top:15px"><table style="width:100%;border-collapse:collapse"><thead><tr><th>Ligne</th><th>Désignation</th><th>Unité</th><th>Quantité</th><th>Référence</th></tr></thead><tbody>${metresRows().slice(0,25).map(r=>`<tr><td>${r.ligne}</td><td>${esc(r.designation)}</td><td>${esc(r.unite)}</td><td>${esc(r.quantite)}</td><td>${esc(r.reference)}</td></tr>`).join('')}</tbody></table></div><p class="small">Aperçu des 25 premières lignes · ${metresRows().length} lignes détectées (limite de démonstration : 5 000 lignes par feuille).</p><div class="actions" style="margin-top:15px"><button class="btn primary" onclick="metresSave()">✓ Confirmer l'import des métrés</button><button class="btn" onclick="metresPending=null;render()">Annuler</button></div></div></div>`:''}
 <div class="card sectiongap"><div class="card-head"><div><h3>3. Décomptes et métrés enregistrés dans cette session</h3><small>${saved.length} fichier(s) · ${saved.reduce((a,x)=>a+x.rows.length,0)} lignes</small></div><button class="btn" ${saved.length?'':'disabled'} onclick="metresExport()">↓ Exporter l'inventaire JSON</button></div><div class="card-body">${saved.length?saved.map((x,i)=>`<div class="dce-file" style="margin-bottom:9px"><span>▤</span><span><b>${esc(x.fileName)}</b><br/><small>${esc(x.lot)} · ${esc(x.sheet)} · ${x.rows.length} lignes · ${esc(x.importedAt)}</small></span><button class="btn" onclick="if(confirm('Retirer cet import de la session ?')){metresStore['${esc(c.id)}'].splice(${i},1);render()}">Retirer</button></div>`).join(''):'<p class="small">Aucun tableau de métrés importé pour cette consultation.</p>'}<p class="small" style="margin-top:14px">Maquette : données conservées uniquement pendant cette session du navigateur. Pas de stockage permanent ni de liaison automatique à la DPGF.</p></div></div>`;
}

let sieSuppliers=[],sieRequests=[],sieCctpFile=null,sieCctpPages=0,sieCctpName='',sieRanges=[{start:'',end:'',label:''}],sieCurrentSupplier='',sieCctpBuffer=null;
const sieFmtBytes=n=>n>1e9?(n/1e9).toFixed(2)+' Go':n>1e6?(n/1e6).toFixed(1)+' Mo':(n/1024).toFixed(0)+' Ko';
function sieSupplierAdd(){let name=document.getElementById('sie-supplier-name').value.trim(),mail=document.getElementById('sie-supplier-mail').value.trim(),category=document.getElementById('sie-supplier-category').value.trim();if(!name)return alert('Indiquez le nom du fournisseur.');sieSuppliers.push({id:'f'+Date.now(),name,mail,category});sieCurrentSupplier=sieSuppliers[sieSuppliers.length-1].id;render();toast('Fournisseur ajouté à la liste de travail.');}
function sieSupplierRemove(id){sieSuppliers=sieSuppliers.filter(s=>s.id!==id);if(sieCurrentSupplier===id)sieCurrentSupplier='';render()}
function sieRangeAdd(){sieRanges.push({start:'',end:'',label:''});render()}
function sieRangeRemove(i){sieRanges.splice(i,1);if(!sieRanges.length)sieRanges=[{start:'',end:'',label:''}];render()}
function sieRangeUpdate(i,k,v){sieRanges[i][k]=v}
async function sieCctpLoad(input){let f=input.files?.[0];if(!f)return;if(f.type!=='application/pdf'&&!f.name.toLowerCase().endsWith('.pdf'))return alert('Sélectionnez un CCTP au format PDF.');sieCctpFile=f;sieCctpName=f.name;sieCctpBuffer=await f.arrayBuffer();sieCctpPages=0;try{if(window.pdfjsLib){let doc=await pdfjsLib.getDocument({data:new Uint8Array(sieCctpBuffer.slice(0))}).promise;sieCctpPages=doc.numPages;}}catch(e){console.warn(e)}render();toast('CCTP chargé localement, sans envoi.');}
function sieSelectedLines(){return [...document.querySelectorAll('.sie-line-check:checked')].map(x=>Number(x.value)).filter(Number.isInteger).map(i=>sieLines()[i]).filter(Boolean)}
function sieLines(){let c=dceCase();let imp=(typeof metresImports!=='undefined'?metresImports:undefined);return state.lines.map(x=>({ref:x.id,name:x.name,qty:x.qty,unit:x.unit}));}
function sieRangesValidated(){let out=[];for(let r of sieRanges){if(!r.start&&!r.end&&!r.label)continue;let a=Number(r.start),b=Number(r.end);if(!Number.isInteger(a)||!Number.isInteger(b)||a<1||b<a||(sieCctpPages&&b>sieCctpPages))throw Error('Plage invalide : vérifiez les pages de début et de fin'+(sieCctpPages?' (PDF : '+sieCctpPages+' pages)':'')+'.');out.push({start:a,end:b,label:r.label.trim()});}return out;}
function sieBuildRequest(){let sup=sieSuppliers.find(x=>x.id===sieCurrentSupplier);if(!sup)throw Error('Sélectionnez ou ajoutez un fournisseur.');let lines=sieSelectedLines(),ranges=sieRangesValidated();if(!lines.length)throw Error('Sélectionnez au moins une ligne de fourniture ou prestation.');let deadline=document.getElementById('sie-deadline').value;let notes=document.getElementById('sie-notes').value.trim();return {id:'DP-'+Date.now(),consultation:dceCase().id,supplier:{...sup},created:new Date().toLocaleDateString('fr-FR'),deadline,notes,lines,ranges,cctp:sieCctpName||'Non chargé',status:'Brouillon — à valider et envoyer par SIE'};}
function siePrepare(){try{let r=sieBuildRequest();sieRequests.push(r);sieLastRequest=r;render();toast('Demande de prix préparée pour '+r.supplier.name+'. Ouvrez le brouillon e-mail ci-dessous.');}catch(e){alert(e.message)}}
let sieLastRequest=null;
function sieDownloadRequest(i){let r=sieRequests[i];if(!r)return;let txt=`DEMANDE DE PRIX — BROUILLON SIE\nConsultation : ${r.consultation}\nFournisseur : ${r.supplier.name}\nCourriel : ${r.supplier.mail||'À compléter'}\nDate limite souhaitée : ${r.deadline||'À compléter'}\n\nFOURNITURES / PRESTATIONS ET QUANTITÉS\n${r.lines.map(l=>`${l.ref} | ${l.name} | ${l.qty??'À vérifier'} ${l.unit||''}`).join('\n')}\n\nEXTRAITS CCTP À JOINDRE : ${r.cctp}\n${r.ranges.map(x=>`Pages ${x.start} à ${x.end} — ${x.label||'Rubrique à vérifier'}`).join('\n')||'Aucun extrait sélectionné'}\n\nConsignes : ${r.notes||'À compléter'}\n\nDOCUMENT À CONTRÔLER AVANT ENVOI. Aucun envoi automatique.`;let blob=new Blob([txt],{type:'text/plain;charset=utf-8'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=r.id+'_demande_prix.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}
async function sieExtractPdf(i){let r=sieRequests[i];if(!r||!r.ranges.length)return alert('Aucune plage de pages pour cette demande.');if(!sieCctpBuffer||r.cctp!==sieCctpName)return alert('Rechargez le CCTP PDF correspondant à cette demande.');if(!window.PDFLib)return alert('Le module PDF est indisponible. Une connexion Internet est nécessaire pour cette fonction.');try{let src=await PDFLib.PDFDocument.load(sieCctpBuffer.slice(0)),out=await PDFLib.PDFDocument.create(),indexes=[];for(let range of r.ranges)for(let n=range.start;n<=range.end;n++){if(n>src.getPageCount())throw Error('Page '+n+' inexistante.');if(!indexes.includes(n-1))indexes.push(n-1)}let pages=await out.copyPages(src,indexes);pages.forEach(pg=>out.addPage(pg));let bytes=await out.save();let blob=new Blob([bytes],{type:'application/pdf'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=r.id+'_extrait_CCTP.pdf';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}catch(e){alert('Extraction impossible : '+e.message)}}

function sieSupplierWorkspace(){let lines=sieLines();return `<div class="card sectiongap"><div class="card-head"><div><h3>Préparer une demande de prix ciblée</h3><small>Choix manuel du fournisseur, des quantités et des extraits du CCTP • Aucun envoi automatique</small></div><span class="badge amber">Brouillon SIE</span></div><div class="card-body"><div class="callout">Chaque fournisseur reçoit uniquement les fournitures, prestations, références et quantités que SIE sélectionne, avec un extrait PDF du CCTP composé de plages de pages éventuellement non consécutives. Les pages sont celles du PDF (et non nécessairement la pagination imprimée). Les informations doivent être vérifiées par SIE.</div>
<h3 style="margin:18px 0 8px">1. Fournisseur destinataire</h3><div style="display:flex;gap:9px;flex-wrap:wrap"><input class="field" id="sie-supplier-name" placeholder="Nom du fournisseur" style="flex:2;min-width:170px"><input class="field" id="sie-supplier-mail" type="email" placeholder="E-mail (facultatif)" style="flex:2;min-width:170px"><input class="field" id="sie-supplier-category" placeholder="Spécialités : luminaires, câbles…" style="flex:2;min-width:170px"><button class="btn" onclick="sieSupplierAdd()">+ Ajouter</button></div><div style="margin:12px 0"><label>Fournisseur de cette demande : <select class="field" onchange="sieCurrentSupplier=this.value"><option value="">— Choisir un fournisseur —</option>${sieSuppliers.map(s=>`<option value="${esc(s.id)}" ${sieCurrentSupplier===s.id?'selected':''}>${esc(s.name)} — ${esc(s.category||'Spécialité à préciser')}</option>`).join('')}</select></label></div>${sieSuppliers.length?`<div class="small">Répertoire de travail : ${sieSuppliers.map(s=>`${esc(s.name)} <button class="btn sm" onclick="sieSupplierRemove('${s.id}')" title="Supprimer">×</button>`).join(' · ')}</div>`:''}
<h3 style="margin:22px 0 8px">2. Articles et quantités à consulter</h3><p class="small">Cochez uniquement les lignes utiles à ce fournisseur. Les quantités ci-dessous proviennent du tableau de démonstration ; vérifiez les métrés importés avant toute demande réelle.</p><div class="table-wrap"><table><thead><tr><th>Inclure</th><th>Référence</th><th>Fourniture / prestation</th><th>Quantité</th><th>Unité</th></tr></thead><tbody>${lines.map((l,i)=>`<tr><td><input class="sie-line-check" type="checkbox" value="${i}"></td><td>${esc(l.ref)}</td><td>${esc(l.name)}</td><td>${esc(l.qty??'À vérifier')}</td><td>${esc(l.unit)}</td></tr>`).join('')}</tbody></table></div>
<h3 style="margin:22px 0 8px">3. CCTP et extraits personnalisés</h3><p class="small">Chargez le CCTP PDF depuis votre ordinateur. Saisissez autant de plages « début / fin » que nécessaire : par exemple pages 12–15 (luminaires) puis 38–42 (câblage). Les pages non sélectionnées sont exclues de l'extrait.</p><label class="btn" style="display:inline-block;cursor:pointer">↑ Choisir le CCTP PDF<input type="file" accept="application/pdf,.pdf" style="display:none" onchange="sieCctpLoad(this)"></label><span class="small" style="margin-left:12px">${sieCctpName?esc(sieCctpName)+' · '+sieFmtBytes(sieCctpFile.size)+(sieCctpPages?' · '+sieCctpPages+' pages':' · pagination à vérifier'):'Aucun PDF chargé'}</span><div style="margin-top:14px">${sieRanges.map((r,i)=>`<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:9px;align-items:center"><span class="small">Plage ${i+1}</span><input class="field" type="number" min="1" placeholder="Page début" style="width:115px" value="${esc(r.start)}" oninput="sieRangeUpdate(${i},'start',this.value)"><input class="field" type="number" min="1" placeholder="Page fin" style="width:115px" value="${esc(r.end)}" oninput="sieRangeUpdate(${i},'end',this.value)"><input class="field" placeholder="Rubrique : luminaires, câblage…" style="flex:1;min-width:180px" value="${esc(r.label)}" oninput="sieRangeUpdate(${i},'label',this.value)"><button class="btn sm" onclick="sieRangeRemove(${i})">Retirer</button></div>`).join('')}</div><button class="btn" onclick="sieRangeAdd()">+ Ajouter une plage de pages non consécutive</button>
<h3 style="margin:22px 0 8px">4. Finaliser le brouillon</h3><div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center"><label class="small">Date limite souhaitée de retour <input id="sie-deadline" class="field" type="date"></label><label class="small" style="flex:1;min-width:260px">Instructions fournisseur <textarea id="sie-notes" class="field" rows="2" style="width:100%" placeholder="Références équivalentes, délais, livraison, documents techniques demandés…"></textarea></label></div><button class="btn primary" style="margin-top:14px" onclick="siePrepare()">✓ Générer la demande de prix pour ce fournisseur</button><p class="note" style="margin-top:8px">L'outil prépare les documents. Le choix final des destinataires, la vérification des pièces et l'envoi restent sous la responsabilité de SIE.</p></div></div>
<div class="card sectiongap"><div class="card-head"><h3>Demandes de prix préparées dans cette session</h3><span class="badge gray">${sieRequests.length} brouillon(s)</span></div><div class="card-body">${sieRequests.length?sieRequests.map((r,i)=>`<div style="padding:14px 0;border-bottom:1px solid #dce2eb"><strong>${esc(r.supplier.name)}</strong> <span class="small">· ${esc(r.consultation)} · ${r.lines.length} poste(s) · ${r.ranges.length} plage(s) CCTP</span><div class="small" style="margin:5px 0">${esc(r.lines.map(l=>l.name).join(' • '))}</div><div style="display:flex;flex-wrap:wrap;gap:8px"><button class="btn primary sm" onclick="sieOpenEmail(${i})">✉ Préparer le mail fournisseur</button><button class="btn sm" onclick="sieDownloadRequest(${i})">↓ Télécharger la demande (texte)</button><button class="btn sm" onclick="sieExtractPdf(${i})">↓ Générer l'extrait CCTP PDF</button><button class="btn sm" onclick="sieRequestRemove(${i})">Supprimer</button></div></div>`).join(''):'<p class="small">Aucune demande préparée. Sélectionnez un fournisseur et ses articles, puis générez un brouillon.</p>'}</div></div>`}
const sieOriginalSuppliers=suppliers;
suppliers=function(){return shell('Demandes de prix fournisseurs','Préparez des demandes de cotation personnalisées à partir des métrés et des seules pages utiles du CCTP.')+demoBar()+sieSupplierWorkspace()+`<details class="card sectiongap"><summary style="cursor:pointer;padding:16px;font-weight:700">Afficher le suivi des devis fictifs de la maquette initiale</summary>${sieOriginalSuppliers()}</details>`};


// Module de rédaction e-mail fournisseur — brouillon uniquement, sans envoi automatique.
let sieMailActive=-1;
function sieMailDraft(r){
 let subject='SIE – Demande de prix – Consultation '+r.consultation+' – '+r.supplier.name;
 let rows=r.lines.map(l=>'- '+[l.ref,l.name, l.qty==null?'Quantité à vérifier':String(l.qty),l.unit||''].filter(Boolean).join(' | ')).join('\n');
 let body='Bonjour,\n\nDans le cadre de la consultation '+r.consultation+', nous vous remercions de bien vouloir nous transmettre votre meilleure offre de prix pour les fournitures et prestations suivantes :\n\n'+rows+'\n\nMerci de préciser vos références proposées, prix unitaires HT, remises éventuelles, délais de livraison, validité de votre offre et fiches techniques pertinentes.\n\n'+(r.deadline?'Date de retour souhaitée : '+r.deadline+'\n\n':'')+(r.notes?'Précisions : '+r.notes+'\n\n':'')+'Vous trouverez en pièces jointes le tableau de quantités et les extraits du CCTP utiles à votre chiffrage.\n\nCordialement,\nL’équipe SIE – Services et Installations Électriques';
 return {subject,body};
}
function sieMailDownload(name,content,type){let blob=new Blob([content],{type:type||'text/plain;charset=utf-8'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),10000)}
function sieMailCsv(i){let r=sieRequests[i];if(!r)return;let quote=x=>'"'+String(x??'').replace(/"/g,'""')+'"';let data=[['Référence','Désignation','Quantité','Unité'],...r.lines.map(l=>[l.ref,l.name,l.qty??'',l.unit||''])].map(row=>row.map(quote).join(';')).join('\r\n');sieMailDownload(r.id+'_quantites_fournisseur.csv','\ufeff'+data,'text/csv;charset=utf-8')}
function sieMailSave(i){let r=sieRequests[i],root=document.getElementById('sie-mail-modal');if(!r||!root)return; r.mailDraft={to:root.querySelector('#sie-mail-to').value.trim(),subject:root.querySelector('#sie-mail-subject').value,body:root.querySelector('#sie-mail-body').value};return r.mailDraft}
function sieMailCopy(i){let d=sieMailSave(i);if(!d)return;let content='À : '+d.to+'\nObjet : '+d.subject+'\n\n'+d.body;if(navigator.clipboard?.writeText){navigator.clipboard.writeText(content).then(()=>alert('E-mail copié. Pensez à joindre les documents avant envoi.')).catch(()=>alert('Copie impossible : sélectionnez le texte manuellement.'))}else alert('Sélectionnez le texte du brouillon pour le copier.')}
function sieMailOpenClient(i){let d=sieMailSave(i);if(!d)return;if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.to)){alert('Renseignez une adresse e-mail destinataire valide.');return}let link='mailto:'+encodeURIComponent(d.to)+'?subject='+encodeURIComponent(d.subject)+'&body='+encodeURIComponent(d.body);if(link.length>1800){alert('Le message est trop long pour une ouverture fiable par mailto. Utilisez « Copier le message » dans votre messagerie, puis joignez les fichiers.');return}window.location.href=link}
function sieMailClose(){document.getElementById('sie-mail-modal')?.remove();sieMailActive=-1}
function sieOpenEmail(i){let r=sieRequests[i];if(!r)return;sieMailClose();sieMailActive=i;let d=r.mailDraft||{to:r.supplier.mail||'',...sieMailDraft(r)};let overlay=document.createElement('div');overlay.id='sie-mail-modal';overlay.style.cssText='position:fixed;inset:0;z-index:99999;background:rgba(15,23,42,.72);overflow:auto;padding:24px 12px;display:flex;align-items:flex-start;justify-content:center';overlay.innerHTML=`<section style="width:min(850px,100%);background:#fff;border-radius:15px;padding:24px;box-shadow:0 16px 55px #0004;color:#182333"><div style="display:flex;align-items:center;justify-content:space-between;gap:12px"><h2 style="margin:0;font-size:23px">✉ Demande de prix — e-mail fournisseur</h2><button class="btn" onclick="sieMailClose()">✕ Fermer</button></div><p class="small" style="margin:12px 0">Brouillon modifiable pour <strong>${esc(r.supplier.name)}</strong> · ${r.lines.length} ligne(s) de quantités · ${r.ranges.length} plage(s) de CCTP. Aucun e-mail n'est envoyé automatiquement.</p><label style="display:block;margin:12px 0">À (fournisseur)<input class="field" id="sie-mail-to" type="email" style="display:block;width:100%" value="${esc(d.to)}"></label><label style="display:block;margin:12px 0">Objet<input class="field" id="sie-mail-subject" style="display:block;width:100%" value="${esc(d.subject)}"></label><label style="display:block;margin:12px 0">Corps du message<textarea class="field" id="sie-mail-body" rows="16" style="display:block;width:100%;font-family:inherit;line-height:1.5">${esc(d.body)}</textarea></label><div class="callout" style="margin:12px 0"><strong>Pièces à joindre manuellement dans votre messagerie :</strong><br>① Tableau des fournitures / quantités (CSV) ; ② Extrait du CCTP (PDF) si des pages ont été sélectionnées. Vérifiez les références, quantités, pages, prix demandés et destinataire avant envoi. Les pièces jointes ne sont pas ajoutées automatiquement via le bouton d'ouverture de la messagerie.</div><div style="display:flex;flex-wrap:wrap;gap:8px;margin:14px 0"><button class="btn" onclick="sieMailCsv(${i})">↓ Télécharger les quantités (CSV)</button><button class="btn" onclick="sieExtractPdf(${i})">↓ Télécharger l'extrait CCTP (PDF)</button><button class="btn" onclick="sieMailCopy(${i})">Copier le message</button><button class="btn primary" onclick="sieMailOpenClient(${i})">✉ Ouvrir dans ma messagerie</button></div><p class="small">Le bouton ouvre votre logiciel de messagerie configuré avec le destinataire, l'objet et le texte. SIE contrôle les pièces jointes et déclenche elle-même l'envoi.</p></section>`;overlay.addEventListener('click',e=>{if(e.target===overlay)sieMailClose()});document.body.appendChild(overlay)}

render();


// SIE — Comparatif des devis reçus et construction contrôlée de la DPGF.
let sieOffers=[];
let sieSelected={};
function sieOfferAdd(){
 const supplier=document.getElementById('sie-off-supplier')?.value.trim();
 const family=document.getElementById('sie-off-family')?.value.trim();
 const file=document.getElementById('sie-off-file')?.files[0];
 if(!supplier||!family){alert('Indiquez le fournisseur et la famille de prestations.');return}
 sieOffers.push({id:'OFF-'+Date.now(),supplier,family,fileName:file?.name||'Non joint',file:file||null,received:new Date().toLocaleDateString('fr-FR'),prices:{}});
 render();
}
function sieOfferPrice(id,ref,value){
 const o=sieOffers.find(x=>x.id===id);if(!o)return;
 if(value==='')delete o.prices[ref];else if(Number(value)>=0)o.prices[ref]=Number(value);
 sieOfferRefresh();
}
function sieOfferChoose(ref,id){
 if(id)sieSelected[ref]=id;else delete sieSelected[ref];
 sieOfferRefresh();
}
function sieOfferRefresh(){
 const root=document.getElementById('sie-offer-comparison');
 if(root)root.innerHTML=sieOfferComparison();
}
function sieOfferComparison(){
 const lines=state.lines;
 return `<div class="table-wrap"><table><thead><tr><th>Poste / quantité</th><th>Offres fournisseurs (PU HT €)</th><th>Fournisseur retenu</th><th>Prix retenu HT</th></tr></thead><tbody>${lines.map(l=>{
 const opts=sieOffers.filter(o=>o.prices[l.id]!==undefined);
 const chosen=sieOffers.find(o=>o.id===sieSelected[l.id]);
 return `<tr><td><b>${esc(l.id)}</b> ${esc(l.name)}<br><small>${l.qty} ${esc(l.unit)}</small></td>
 <td>${opts.length?opts.map(o=>`<div>${esc(o.supplier)} : <b>${euro(o.prices[l.id])}</b></div>`).join(''):'<span class="badge amber">Aucun prix reçu</span>'}</td>
 <td><select class="field" onchange="sieOfferChoose('${esc(l.id)}',this.value)"><option value="">— Choisir manuellement —</option>${opts.map(o=>`<option value="${esc(o.id)}" ${chosen?.id===o.id?'selected':''}>${esc(o.supplier)}</option>`).join('')}</select></td>
 <td>${chosen&&chosen.prices[l.id]!==undefined?euro(chosen.prices[l.id]):'À compléter'}</td></tr>`}).join('')}</tbody></table></div>`;
}
function sieOffersWorkspace(){
 const rows=state.lines;
 return `<section class="card sectiongap"><div class="card-head"><div><h3>Étape 6 — Réception et comparaison des devis fournisseurs</h3><small>Plusieurs offres pour une même demande • Choix manuel poste par poste • Aucune attribution automatique</small></div><span class="badge amber">Validation SIE</span></div>
 <div class="card-body"><div class="callout">Après réception des devis par SIE, déposez les fichiers reçus et saisissez leurs prix unitaires. Les fichiers sont conservés uniquement dans cette session de navigateur. La comparaison n'analyse pas automatiquement les PDF.</div>
 <div class="grid3"><label>Fournisseur<input id="sie-off-supplier" class="field" placeholder="Nom du fournisseur"></label><label>Famille / demande de prix<input id="sie-off-family" class="field" placeholder="Ex. Éclairage"></label><label>Devis reçu (PDF, Excel...)<input id="sie-off-file" class="field" type="file" accept=".pdf,.xlsx,.xls,.csv,.doc,.docx"></label></div>
 <p><button class="btn primary" onclick="sieOfferAdd()">＋ Enregistrer un devis reçu</button></p></div>
 ${sieOffers.map(o=>`<div class="card-body" style="border-top:1px solid #dce3ea"><b>${esc(o.supplier)}</b> — ${esc(o.family)} <small>• ${esc(o.fileName)}</small>
 <div class="table-wrap"><table><thead><tr><th>Poste</th><th>Quantité</th><th>PU HT du devis (€)</th></tr></thead><tbody>${rows.map(l=>`<tr><td>${esc(l.id)} — ${esc(l.name)}</td><td>${l.qty} ${esc(l.unit)}</td><td><input class="field" style="max-width:150px" type="number" min="0" step="0.01" value="${o.prices[l.id]??''}" placeholder="Non proposé" oninput="sieOfferPrice('${o.id}','${esc(l.id)}',this.value)"></td></tr>`).join('')}</tbody></table></div>
 <button class="btn sm" onclick="sieOffers=sieOffers.filter(x=>x.id!=='${o.id}');Object.keys(sieSelected).forEach(k=>{if(sieSelected[k]==='${o.id}')delete sieSelected[k]});render()">Retirer ce devis</button></div>`).join('')}
 <div class="card-head"><div><h3>Comparatif et sélection des offres</h3><small>La meilleure offre n'est pas nécessairement la moins chère : SIE vérifie aussi la conformité, les délais et les conditions.</small></div></div>
 <div id="sie-offer-comparison">${sieOfferComparison()}</div>
 <div class="card-body"><label><input id="sie-off-confirm" type="checkbox"> Je confirme que les prix et devis sélectionnés ont été vérifiés par SIE.</label><p><button class="btn primary" onclick="sieOfferApply()">Appliquer les prix retenus à la DPGF</button> <button class="btn" onclick="sieOfferExport()">↓ Générer la DPGF — modèle SIE</button></p><div class="callout">Export dans les feuilles originales « Suivi affaire » et « DPGF ST » ; une feuille « Suivi fournisseurs » documente les choix. Les quantités restent celles du métré affiché dans la DPGF. Les coûts de main-d'œuvre, frais, aléas, marges et prix de vente sont à compléter ou valider par SIE. Les postes sans devis restent signalés.</div></div></section>`;
}
function sieOfferApply(){
 if(!document.getElementById('sie-off-confirm')?.checked){alert('Confirmez la vérification des devis par SIE.');return}
 let count=0;
 state.lines.forEach(l=>{let o=sieOffers.find(x=>x.id===sieSelected[l.id]);if(o&&o.prices[l.id]!==undefined){l.price=o.prices[l.id];l.sieSupplier=o.supplier;count++}});
 alert(count+' prix unitaires fournisseurs appliqués à la DPGF de travail. Les prix de vente restent à valider.');
 render();
}
function sieOfferExport(){
 if(!window.XLSX){alert('La bibliothèque Excel n’est pas disponible. Vérifiez votre connexion Internet.');return}
 const rows=state.lines.map(l=>{
 const o=sieOffers.find(x=>x.id===sieSelected[l.id]);
 const pu=o?.prices[l.id];
 return {'Code':l.id,'Désignation':l.name,'Unité':l.unit,'Quantité':Number(l.qty),'Fournisseur retenu':o?.supplier||'À vérifier','Prix fournisseur unitaire HT':pu??'','Total achat HT':pu===undefined?'':Number(l.qty)*pu,'Main-d’œuvre HT':'','Frais / aléas HT':'','Marge HT':'','Prix de vente unitaire HT':'','Total vente HT':'','Contrôle':pu===undefined?'Prix manquant':'À valider par SIE'};
 });
 const wb=XLSX.utils.book_new(),ws=XLSX.utils.json_to_sheet(rows);
 ws['!cols']=[{wch:15},{wch:45},{wch:12},{wch:13},{wch:28},{wch:24},{wch:20},{wch:20},{wch:20},{wch:14},{wch:24},{wch:20},{wch:23}];
 XLSX.utils.book_append_sheet(wb,ws,'DPGF provisoire');
 XLSX.writeFile(wb,'SIE_DPGF_provisoire_a_valider.xlsx');
}
const sieDpgfOriginal=dpgf;

// Bibliothèque historique SIE : prototype de recherche lexicale locale (pas de RAG vectoriel/LLM).
let sieHistory=[];
let sieHistoryResults=[];
function sieHistoryAdd(){
 const name=document.getElementById('sie-hist-name')?.value.trim();
 const activity=document.getElementById('sie-hist-activity')?.value.trim();
 const content=document.getElementById('sie-hist-content')?.value.trim();
 if(!name||!content){alert('Renseignez le titre et le texte du mémoire historique.');return}
 sieHistory.push({id:Date.now(),name,activity:activity||'Non classé',content});render();
}
async function sieHistoryFiles(input){
 const files=Array.from(input.files||[]);
 for(const f of files){
  if(!/\.(txt|md)$/i.test(f.name)){alert(f.name+' : pour cette maquette, importez un texte .txt ou .md (PDF/DOCX à prévoir dans le futur moteur RAG).');continue}
  const content=await f.text();sieHistory.push({id:Date.now()+Math.random(),name:f.name,activity:'À classer',content});
 }
 render();
}
function sieHistorySearch(){
 const q=document.getElementById('sie-hist-query')?.value.trim()||'';
 const terms=(q.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').match(/[a-z0-9]{3,}/g)||[]).filter(x=>!['pour','avec','dans','les','des','une','sur','par','lot','sie'].includes(x));
 sieHistoryResults=sieHistory.map(doc=>{
  const chunks=doc.content.match(/[\s\S]{1,1200}/g)||[];
  const matches=chunks.map((text,i)=>({text,i,score:terms.reduce((n,t)=>n+(text.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').includes(t)?1:0),0)})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,3);
  return {doc,matches,score:matches.reduce((n,m)=>n+m.score,0)};
 }).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,6);
 const node=document.getElementById('sie-history-results');if(node)node.innerHTML=sieHistoryResultHTML();
}
function sieHistoryResultHTML(){
 return sieHistoryResults.length?sieHistoryResults.map(x=>`<div style="padding:12px;border:1px solid #ddd;border-radius:8px;margin:10px 0"><b>${esc(x.doc.name)}</b> · ${esc(x.doc.activity)} <small>— ${x.matches.length} extrait(s) pertinent(s)</small>${x.matches.map(m=>`<blockquote style="white-space:pre-wrap;max-height:160px;overflow:auto;padding:8px;background:#f6f8fa">${esc(m.text)}</blockquote>`).join('')}</div>`).join(''):'<p class="small">Aucun extrait trouvé. Importez des mémoires historiques ou modifiez les mots-clés.</p>';
}
function sieHistoryPanel(){return `<section class="card sectiongap"><div class="card-head"><div><h3>📚 Bibliothèque des mémoires techniques historiques SIE</h3><small>Références par activité pour conserver le style et les méthodes de rédaction de SIE.</small></div><span class="badge amber">Prototype de recherche locale</span></div><div class="card-body"><div class="callout">Dans cette maquette, les textes historiques sont recherchés par mots-clés dans le navigateur. Ce n'est pas encore un véritable RAG : pas d'embeddings, de base vectorielle, de génération IA ni de stockage durable. Ne copiez pas sans vérifier les références, moyens, produits et engagements anciens.</div><div class="grid3"><label>Titre / référence historique<input class="field" id="sie-hist-name" placeholder="Ex. Mémoire CFO/CFA – Projet X"></label><label>Activité / spécialité<input class="field" id="sie-hist-activity" placeholder="Ex. CFO, CFA, SSI, CVC"></label><label>Importer un texte historique<input class="field" type="file" multiple accept=".txt,.md" onchange="sieHistoryFiles(this)"></label></div><label style="display:block;margin-top:12px">Texte d'un ancien mémoire<textarea class="field" id="sie-hist-content" rows="4" style="width:100%" placeholder="Coller ici le contenu d'un mémoire historique SIE..."></textarea></label><p><button class="btn" onclick="sieHistoryAdd()">＋ Ajouter à la bibliothèque</button></p><p class="small">${sieHistory.length} mémoire(s) historiques chargés dans cette session. Les documents ne sont pas envoyés à un serveur.</p>${sieHistory.map(x=>`<div style="padding:7px;border-bottom:1px solid #ddd">${esc(x.name)} · <small>${esc(x.activity)}</small> <button class="btn sm" onclick="sieHistory=sieHistory.filter(d=>d.id!==${x.id});render()">Retirer</button></div>`).join('')}<h4>Retrouver des passages et formulations SIE</h4><div style="display:flex;gap:10px;flex-wrap:wrap"><input class="field" id="sie-hist-query" style="flex:1" placeholder="Ex. essais luminaires, coordination SSI, phasage chantier"><button class="btn primary" onclick="sieHistorySearch()">Rechercher dans l'historique</button></div><div id="sie-history-results">${sieHistoryResultHTML()}</div><p class="small">Utilisez ces extraits comme références pour rédiger le mémoire du lot ou le mémoire commun. La réponse finale doit traiter les exigences du DCE actif et les alertes identifiées.</p></div></section>`}

let sieSyncUi={running:false,message:'Aucune synchronisation manuelle lancée dans cette session.',last:''};
async function sieRagSyncNow(){
 if(sieSyncUi.running)return;
 const url=(document.getElementById('sie-rag-url')?.value||sieLocalRagConfig.url||'').trim().replace(/\/$/,'');
 if(!url){sieSyncUi.message='Service local non configuré : renseignez l’adresse du service RAG interne, puis enregistrez la configuration.';sieRagSyncStatus();return;}
 if(!/^https?:\/\//i.test(url)){sieSyncUi.message='Adresse du service invalide : utilisez une URL HTTP(S) interne.';sieRagSyncStatus();return;}
 if(!confirm('Demander au service RAG SIE une synchronisation incrémentale immédiate ? La tâche quotidienne reste activée.'))return;
 sieSyncUi.running=true;sieSyncUi.message='Demande de synchronisation envoyée au service local…';sieRagSyncStatus();
 try{
  const response=await fetch(url+'/sync',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:'incremental',trigger:'manual'})});
  if(!response.ok)throw new Error('Réponse HTTP '+response.status);
  const result=await response.json();
  sieSyncUi.last=new Date().toLocaleString('fr-FR');
  sieSyncUi.message=result.message||'Demande acceptée par le service local. Consultez le suivi serveur pour confirmer la fin de l’indexation.';
 }catch(err){sieSyncUi.message='Synchronisation non lancée ou non confirmée : '+err.message+'. Vérifiez le service interne, le réseau et les autorisations.';}
 finally{sieSyncUi.running=false;sieRagSyncStatus();}
}
function sieRagSyncStatus(){const n=document.getElementById('sie-rag-sync-status');if(n)n.textContent=sieSyncUi.message+(sieSyncUi.last?' Dernière demande acceptée : '+sieSyncUi.last:'');const b=document.getElementById('sie-rag-sync-button');if(b)b.disabled=sieSyncUi.running;}
function sieRagCopySpec(){
 const spec=`SIE TENDER INTELLIGENCE — RAG PRIVÉ / SUR SITE\n\nSource documentaire : ${sieLocalRagConfig.path||'À renseigner'}\nService interne : ${sieLocalRagConfig.url||'À renseigner'}\nModèle local : ${sieLocalRagConfig.model||'À définir'}\nIndex local : ${sieLocalRagConfig.index||'À définir'}\nSynchronisation manuelle : bouton à la demande, via POST /sync du service interne, avec authentification et journalisation côté serveur\nFréquence de contrôle : ${sieLocalRagConfig.frequency==='1440'?'une fois par jour':'toutes les '+sieLocalRagConfig.frequency+' minutes'}\nSous-dossiers : ${sieLocalRagConfig.includeSubfolders?'oui':'non'}\nMémoires validés uniquement : ${sieLocalRagConfig.approvedOnly?'oui':'non'}\n\nSynchronisation incrémentale : premier inventaire local, suivi des ajouts/modifications/suppressions/déplacements, empreintes et horodatages, file de traitement, reprise sur erreur, journal local, contrôle périodique de cohérence même si la surveillance Windows manque des événements. Ne jamais modifier les fichiers sources. Exclure brouillons et documents temporaires. Hériter des ACL du partage pour filtrer les résultats. Ne pas réutiliser un mémoire non validé.\n\nArchitecture requise : service d'indexation sur réseau SIE, accès lecture seule aux partages autorisés, extraction DOCX/PDF locale, recherche hybride/embeddings locaux, génération LLM locale, aucune API cloud, aucune télémétrie externe, aucune synchronisation automatique hors réseau, journaux locaux, contrôle des droits d'accès, chiffrement au repos et en transit sur réseau interne, traçabilité des sources et validation humaine.\n\nÉtat : PROTOTYPE, AUCUNE CONNEXION RÉELLE.\n`;navigator.clipboard?.writeText(spec).then(()=>alert('Spécification copiée.')).catch(()=>prompt('Copier la spécification',spec));
}

 const header=type==='suppliers'?(o.name||'Nouveau fournisseur'):type==='users'?([o.first,o.last].filter(Boolean).join(' ')||'Nouvel utilisateur'):(o.name||'Nouvelle personne');
 const fields=type==='suppliers'?[sieField(type,o,'name','Raison sociale'),sieField(type,o,'specialties','Spécialités / familles de fournitures'),sieField(type,o,'status','Statut',['Actif','Inactif'])]:type==='users'?[sieField(type,o,'last','Nom'),sieField(type,o,'first','Prénom'),sieField(type,o,'company','Société'),sieField(type,o,'interlocutor','Interlocuteur'),sieField(type,o,'employee','Salarié'),sieField(type,o,'login','Identifiant plateforme'),sieField(type,o,'windows','Login Windows'),sieField(type,o,'email','E-mail'),sieField(type,o,'role','Droits / rôle',['Administrateur','Chargé d’affaires','Bureau d’études','Direction','Lecture seule']),sieField(type,o,'status','Statut',['Actif','Inactif'])]:[sieField(type,o,'name','Nom et prénom'),sieField(type,o,'role','Fonction'),sieField(type,o,'phone','Téléphone'),sieField(type,o,'email','E-mail'),sieField(type,o,'zones','Secteurs géographiques / disponibilités'),sieField(type,o,'status','Statut',['Actif','Inactif'])];
 return `<section class="card sectiongap"><div class="card-head"><div><h3>${esc(header)}</h3><small>${o.status==='Actif'?'Actif':'Archivé / inactif'}</small></div><div class="actions"><button class="btn sm" onclick="sieSettingsArchive('${type}','${o.id}')">${o.status==='Actif'?'Désactiver':'Réactiver'}</button><button class="btn sm" onclick="sieSettingsDelete('${type}','${o.id}')">Supprimer (démo)</button></div></div><div class="card-body"><div class="grid3" style="gap:12px">${fields.join('')}</div>${type==='suppliers'?`<h4 style="margin-top:20px">Contacts du fournisseur</h4>${o.contacts.map(c=>`<div style="border:1px solid #dce4ed;border-radius:8px;padding:12px;margin:10px 0"><div class="grid3" style="gap:10px">${['name','role','email','phone'].map((k,i)=>sieContactField(o,c,k,['Nom et prénom','Fonction','E-mail','Téléphone'][i])).join('')}</div><button class="btn sm" style="margin-top:8px" onclick="sieSettingsContactRemove('${o.id}','${c.id}')">Retirer ce contact</button></div>`).join('')}<button class="btn" onclick="sieSettingsContactAdd('${o.id}')">＋ Ajouter un contact</button>`:''}</div></section>`;
}
let sieSettingsTab='suppliers';
function sieSettingsTabSet(t){sieSettingsTab=t;render()}
function parametres(){return shell('Paramètres et référentiels SIE','Gérer les fournisseurs, les utilisateurs et les personnes disponibles pour les visites de site.')+demoBar()+`<div class="callout sectiongap">Référentiels de démonstration, enregistrés localement dans ce navigateur (non partagés entre postes). Pas de création de compte Windows, pas de droits réellement appliqués et aucun mot de passe enregistré. En production, stockage sur serveur SIE, droits par rôle, journal d’audit et authentification Windows / Active Directory.</div><div class="actions sectiongap">${Object.entries(sieSettingsLabels).map(([k,v])=>`<button class="btn ${sieSettingsTab===k?'primary':''}" onclick="sieSettingsTabSet('${k}')">${esc(v)} (${sieSettings[k].length})</button>`).join('')}</div><div class="card sectiongap"><div class="card-head"><div><h3>${sieSettingsLabels[sieSettingsTab]}</h3><small>${sieSettingsTab==='suppliers'?'Plusieurs contacts possibles par société ; spécialités pour les demandes de prix.':sieSettingsTab==='users'?'Champs inspirés de votre fiche utilisateur. Aucun mot de passe dans le prototype.':'Ces personnes pourront être choisies dans la fiche de renseignement.'}</small></div><button class="btn primary" onclick="sieSettingsAdd('${sieSettingsTab}')">＋ Ajouter</button></div></div>${sieSettings[sieSettingsTab].map(o=>sieSettingsCard(sieSettingsTab,o)).join('')||'<div class="card sectiongap"><div class="card-body">Aucune fiche créée. Cliquez sur « Ajouter » pour commencer.</div></div>'}`}
// SIE : sauvegarde locale des référentiels de démonstration (sans mot de passe).
try { const saved=JSON.parse(localStorage.getItem('sie_referentiels_v2')||'null'); if(saved){for(const k of ['suppliers','users','visitors'])if(Array.isArray(saved[k]))sieSettings[k]=saved[k];} } catch(e) {console.warn('Référentiels locaux non chargés',e)}
function sieSettingsPersist(){try{localStorage.setItem('sie_referentiels_v2',JSON.stringify(sieSettings))}catch(e){console.warn('Sauvegarde locale impossible',e)}}
const sieSettingsAddOriginal=sieSettingsAdd;
sieSettingsAdd=function(type){sieSettingsAddOriginal(type);sieSettingsPersist()};
const sieSettingsEditOriginal=sieSettingsEdit;
sieSettingsEdit=function(type,id,field,value){sieSettingsEditOriginal(type,id,field,value);sieSettingsPersist()};
const sieSettingsContactEditOriginal=sieSettingsContactEdit;
sieSettingsContactEdit=function(id,cid,field,value){sieSettingsContactEditOriginal(id,cid,field,value);sieSettingsPersist()};
const sieSettingsContactAddOriginal=sieSettingsContactAdd;
sieSettingsContactAdd=function(id){sieSettingsContactAddOriginal(id);sieSettingsPersist()};
const sieSettingsContactRemoveOriginal=sieSettingsContactRemove;
sieSettingsContactRemove=function(id,cid){sieSettingsContactRemoveOriginal(id,cid);sieSettingsPersist()};
const sieSettingsArchiveOriginal=sieSettingsArchive;
sieSettingsArchive=function(type,id){sieSettingsArchiveOriginal(type,id);sieSettingsPersist()};
const sieSettingsDeleteOriginal=sieSettingsDelete;
sieSettingsDelete=function(type,id){sieSettingsDeleteOriginal(type,id);sieSettingsPersist()};
const sieRenderBeforeSettings=render;
const sieNavBase=renderNav;
renderNav=function(){sieNavBase();const nav=document.getElementById('nav');if(nav){nav.style.overflowY='visible';nav.style.paddingBottom='18px';const b=nav.querySelector('button[onclick="go(\'parametres\')"]');if(b){b.style.background='rgba(255,255,255,.13)';b.style.border='1px solid rgba(255,255,255,.25)';b.style.marginTop='10px';}}};
render=function(){
 if(state.view==='parametres'){renderNav();document.getElementById('app').innerHTML=parametres();return}
 sieRenderBeforeSettings();
 if(state.view==='fiche'){
  const active=sieSettings.visitors.filter(x=>x.status==='Actif'&&x.name.trim());
  if(active.length){
   const text=Array.from(document.querySelectorAll('#app .fiche-field span')).find(x=>/responsable.*visite|personne.*visite/i.test(x.textContent));
   const existing=text?.parentElement?.querySelector('input');
   if(existing){const select=document.createElement('select');select.className='field';select.style.width='100%';select.innerHTML='<option value="">— Choisir une personne du référentiel —</option>'+active.map(x=>`<option value="${esc(x.name)}" ${ficheData().responsable===x.name?'selected':''}>${esc(x.name)}${x.role?' — '+esc(x.role):''}</option>`).join('');select.addEventListener('change',()=>{ficheSet('responsable',select.value);existing.value=select.value});existing.parentElement.insertBefore(select,existing);}
  }
 }
};

// Contrôle de rendu final : chaque entrée de navigation doit afficher un contenu.
const sieRenderValidated=render;
render=function(){
 try {
  sieRenderValidated();
  const app=document.getElementById('app');
  if(app && !app.innerHTML.trim())throw new Error('Contenu non disponible pour cette rubrique');
 } catch(err){
  console.error('SIE - erreur affichage',state.view,err);
  const app=document.getElementById('app');
  if(app)app.innerHTML='<div class="hero"><h2>Rubrique momentanément indisponible</h2><p>Une erreur de la maquette a empêché son affichage. Essayez de revenir au tableau de bord.</p><button class="btn primary" onclick="go(\'dashboard\')">Retour au tableau de bord</button></div>';
 }
};
// Reprise après chargement complet des modules.
render();

</script>
</body></html>
